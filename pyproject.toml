[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixhauser-ahrq"
version = "2026.1.3"
description = "AHRQ Elixhauser Comorbidity Index for ICD-10-CM — maps 4,568 diagnosis codes to 38 comorbidity categories with van Walraven scoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Frank G. Opelka, MD, FACS", email = "fopelka@eocs.ltd"},
]
maintainers = [
    {name = "Episodes of Care Solutions (EOCS)", email = "fopelka@eocs.ltd"},
]
keywords = [
    "elixhauser",
    "comorbidity",
    "risk-adjustment",
    "ICD-10",
    "healthcare",
    "clinical",
    "van-walraven",
    "AHRQ",
    "HCUP",
    "episode-of-care",
    "patient-safety",
    "quality-measurement",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/fopelka-EOCS/elixhauser-ahrq"
Documentation = "https://github.com/fopelka-EOCS/elixhauser-ahrq#readme"
Repository = "https://github.com/fopelka-EOCS/elixhauser-ahrq"
"Bug Tracker" = "https://github.com/fopelka-EOCS/elixhauser-ahrq/issues"
"EOCS Analytics" = "https://www.eocs.ltd"
"Hugging Face Dataset" = "https://huggingface.co/datasets/EOCS-LTD/elixhauser-icd10-mapping"
"Hugging Face Demo" = "https://huggingface.co/spaces/fopelka/elixhauser-risk-calculator"
Changelog = "https://github.com/fopelka-EOCS/elixhauser-ahrq/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["elixhauser_ahrq*"]

[tool.setuptools.package-data]
elixhauser_ahrq = ["data/*.xlsx", "data/*.csv", "data/*.json", "*.csv", "*.json", "*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
