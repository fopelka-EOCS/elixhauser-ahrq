[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixhauser-ahrq"
version = "2027.1.0"
description = "Python reimplementation of AHRQ Elixhauser Comorbidity Software Refined for ICD-10-CM v2027.1: 38 measures with POA handling, and AHRQ mortality and readmission indices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Frank G. Opelka, MD, FACS", email = "fopelka@eocs.ltd"},
]
maintainers = [
    {name = "Episodes of Care Solutions (EOCS)", email = "fopelka@eocs.ltd"},
]
keywords = [
    "elixhauser",
    "comorbidity",
    "risk-adjustment",
    "ICD-10",
    "healthcare",
    "clinical",
    "AHRQ",
    "HCUP",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/fopelka-EOCS/elixhauser-ahrq"
Documentation = "https://github.com/fopelka-EOCS/elixhauser-ahrq#readme"
Repository = "https://github.com/fopelka-EOCS/elixhauser-ahrq"
"Bug Tracker" = "https://github.com/fopelka-EOCS/elixhauser-ahrq/issues"
"EOCS Analytics" = "https://www.eocs.ltd"
Changelog = "https://github.com/fopelka-EOCS/elixhauser-ahrq/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["elixhauser_ahrq*"]

[tool.setuptools.package-data]
elixhauser_ahrq = ["data/*.json.gz", "data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
